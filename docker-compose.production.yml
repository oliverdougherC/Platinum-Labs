# Production hardening + topology override for the Homelab Homepage.
#
# Usage:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.production.yml \
#     up -d --build
#
# Enable the hardened ZFS sidecar only when this host exposes /dev/zfs:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.production.yml \
#     --profile zfs-sidecar \
#     up -d --build

services:
  homepage:
    restart: unless-stopped
    init: true
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    ports:
      - "${HOMEPAGE_BIND_ADDRESS:-127.0.0.1}:${HOMEPAGE_PORT:-3000}:3000"
    networks:
      default: {}
      media: {}
      jellyfin: {}
      zfs_private: {}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zfs-collector:
    profiles: ["zfs-sidecar"]
    build:
      context: .
      dockerfile: docker/zfs-collector.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    environment:
      ZFS_COLLECTOR_TOKEN: ${ZFS_COLLECTOR_TOKEN:?set ZFS_COLLECTOR_TOKEN when enabling the zfs-sidecar profile}
      ZFS_COLLECTOR_BIND: 0.0.0.0
      ZFS_COLLECTOR_PORT: 9797
      # Host telemetry (PLA-265): host procfs mounted read-only below. Network
      # counters are read from /host/proc/1/net/dev (host netns via pid 1);
      # without the mount the network section reports "unavailable" (never 0).
      HOST_PROC: /host/proc
      # Host sysfs (read-only mount below) provides CPU topology
      # (sockets / physical cores / SMT siblings). Without it the cpu
      # section still works; topology is simply reported null.
      HOST_SYS: /host/sys
      # Optional: aggregate only these interfaces (comma-separated). Default:
      # physical-looking interfaces (en*/eth*/bond*), excluding veth/br/tailscale.
      HOST_NET_INTERFACES: ${HOST_NET_INTERFACES:-}
      # Read-only Docker socket proxy URL (GET-only endpoints used). Defaults
      # to the stack's own narrow proxy below; set empty to report the docker
      # section as "not-configured".
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-http://docker-proxy:2375}
    devices:
      - "/dev/zfs:/dev/zfs"
    volumes:
      # Read-only host procfs for CPU/memory/disk/network counters (PLA-265).
      - /proc:/host/proc:ro
      # Read-only host CPU-topology sysfs subtree (sockets/cores/threads).
      # Deliberately NOT all of /sys: the collector only reads
      # devices/system/cpu, so nothing else is exposed to the container.
      - /sys/devices/system/cpu:/host/sys/devices/system/cpu:ro
    expose:
      - "9797"
    hostname: zfs-collector
    # Two-network isolation (PLA-265): `zfs_private` carries homepage →
    # collector polling; `docker_telemetry_private` carries collector →
    # docker-proxy only. The homepage never joins the latter, so it can reach
    # the collector but can never reach the Docker socket proxy.
    networks:
      zfs_private:
        aliases:
          - zfs-collector
      docker_telemetry_private: {}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os,sys,urllib.request; req=urllib.request.Request('http://127.0.0.1:9797', headers={'Authorization': 'Bearer '+os.environ['ZFS_COLLECTOR_TOKEN']}); sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Narrow read-only Docker telemetry access (PLA-265/272 review blocker).
  # The collector may ONLY reach `GET /containers/*` (list + one-shot stats):
  # the proxy denies every other API section, POST is disabled, and the socket
  # is mounted read-only. The proxy lives exclusively on the internal
  # `docker_telemetry_private` network, which only `zfs-collector` shares —
  # `homepage` sits on `zfs_private` (homepage ↔ collector) and is NOT attached
  # to `docker_telemetry_private`, so the dashboard container has no route to
  # the Docker socket at all. This is deliberately NOT an unrestricted
  # /var/run/docker.sock mount.
  docker-proxy:
    profiles: ["zfs-sidecar"]
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      # Everything else (exec, images, volumes, networks, swarm, …) defaults
      # to denied in this image; list nothing so nothing else opens.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      docker_telemetry_private:
        aliases:
          - docker-proxy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homelab-data:
    name: ${HOMEPAGE_VOLUME_NAME:-homelab-homepage-data}

networks:
  media:
    external: true
    name: ${MEDIA_NETWORK_NAME:-media_default}
  jellyfin:
    external: true
    name: ${JELLYFIN_NETWORK_NAME:-jellyfin_default}
  zfs_private:
    internal: true
  # Collector-only hop to the Docker socket proxy. Internal (no egress), and
  # joined by exactly zfs-collector + docker-proxy — never homepage.
  docker_telemetry_private:
    internal: true
